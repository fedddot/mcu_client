syntax = "proto3";

package stepper_service;

message StepperRequest {
	oneof request {
		StepperEnableRequest enable_request = 1;
		StepperStepsRequest steps_request = 2;
	}
}

message StepperEnableRequest {
	StepperStatus status = 1;
}

message StepperStepsRequest {
	StepperDirection direction = 1;
	uint32 step_duration_us = 2;
	uint32 steps_number = 3;
}

message StepperResponse {
	StepperResultCode result = 1;
	StepperStatus stepper_status = 2;
	string error_message = 3;
}

enum StepperStatus {
	DISABLED = 0;
	ENABLED = 1;
}

enum StepperDirection {
	CW = 0;
	CCW = 1;
}

enum StepperResultCode {
	SUCCESS = 0;
	FAILURE = 1;
}